:root {
  /* Xplore brand palette (Brand Guide, Sept 2022), RGB for anything viewed digitally */
  --xp-dark:       #002B2B;   /* North Shore Green 0/43/43 : page background */
  --xp-carmanah:   #306154;   /* Carmanah Green 48/97/84   : tiles, boxes, panels */
  --xp-green:      #58C774;   /* Superior Green 88/199/116 : picked state, rules, section titles */
  --xp-solar:      #00FF57;   /* Solar Wind 0/255/87       : used sparingly (digital only) */
  --xp-white:      #FFFFFF;
  --xp-orange:     #FFB21C;   /* contrast colour: unanswered marker only */
  --xp-font: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Approved pairings only: on North Shore or Carmanah use Superior, Solar Wind or White text;
   on Superior or Solar Wind use North Shore text. */

html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: dark; background: var(--xp-dark); }

*, *::before, *::after { box-sizing: border-box; }

/* no double-tap zoom or tap delay when tapping choices quickly */
button, input, textarea { touch-action: manipulation; }

body {
  font-family: var(--xp-font);
  color: var(--xp-white);
  background: var(--xp-dark);
  margin: 0;
  padding: 0;
  padding-bottom: 12rem;
  line-height: 1.5;
}

h1, h2, h3 { color: var(--xp-white); margin: 0; letter-spacing: -0.01em; }
h1 { font-weight: 700; font-size: 1.15rem; }
h2 { font-weight: 600; font-size: 1.05rem; }

.wrap { max-width: 44rem; margin: 0 auto; padding: 1.1rem 0.9rem 0; }
.hidden { display: none !important; }

/* header: North Shore Green with the Superior Green logo, a quiet Carmanah rule underneath */
header.app-header {
  background: var(--xp-dark); color: var(--xp-white);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 0 1.1rem;
  border-bottom: 2px solid var(--xp-carmanah);
}
.app-header-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; }   /* same box as .wrap, so the left edges match at any width */
header.app-header img { width: 7.5rem; height: auto; display: block; }
header.app-header h1 { color: var(--xp-white); font-size: 1.3rem; line-height: 1.25; margin-top: 0.85rem; }
header.app-header p { margin: 0.3rem 0 0; font-size: 0.9rem; line-height: 1.4; color: var(--xp-white); }

.link-btn {
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem;
  color: var(--xp-white); background: var(--xp-dark);
  border: 2px solid transparent; border-radius: 0.6rem;
  padding: 0.55rem 0.9rem; min-height: 2.8rem; cursor: pointer;
}

.notice {
  background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem; margin-bottom: 1rem;
  display: flex; gap: 0.7rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
}

/* the technician box is a small panel; the form itself sits straight on the page */
.card { margin-bottom: 1rem; }
.card.tech-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 0.9rem; }
.card.tech-card input[type="text"] { background: var(--xp-dark); }
.card-title { margin-bottom: 1.2rem; }

.form-section { margin-bottom: 2.2rem; }
.form-section:last-child { margin-bottom: 0; }
.form-section-title {
  font-size: 1.05rem; font-weight: 600; color: var(--xp-green);
  padding-bottom: 0.5rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--xp-carmanah);
}

.field { margin-bottom: 1.7rem; padding: 0.2rem 0; scroll-margin-top: 1rem; }
.field:last-child { margin-bottom: 0; }
.q { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 0.45rem; color: var(--xp-white); }
.q .opt, .form-section-title .opt { font-weight: 400; color: var(--xp-white); font-size: 0.9rem; }
.hint { font-size: 0.9rem; color: var(--xp-white); margin: 0 0 0.6rem; }
.sub-q { font-weight: 600; font-size: 0.95rem; margin: 0.9rem 0 0.4rem; }

/* choice buttons: Carmanah tiles, Superior Green when picked */
.choices { display: grid; gap: 0.6rem; grid-template-columns: 1fr; }
.choices.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.choice {
  font-family: var(--xp-font); font-weight: 600; font-size: 1rem; line-height: 1.3;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 3.5rem; padding: 0.7rem 0.8rem; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 0.6rem; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice { justify-content: center; text-align: center; }
.choice .mark {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 2px solid var(--xp-white); display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.95rem; line-height: 1;
}
.choices.cols-5 .choice .mark, .choices.cols-4 .choice .mark, .choices.cols-3 .choice .mark, .choices.cols-2 .choice .mark { display: none; }
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice { padding-left: 0.35rem; padding-right: 0.35rem; }
.choices.cols-3 { gap: 0.45rem; }
.choices.cols-3 .choice { font-size: 0.88rem; padding-left: 0.2rem; padding-right: 0.2rem; }
@media (max-width: 340px) { .choices.cols-3 { grid-template-columns: minmax(0, 1fr); } }
.choices.cols-5, .choices.cols-4 { gap: 0.45rem; }
.choice:active { background: var(--xp-solar); color: var(--xp-dark); }
.choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.choice[aria-checked="true"] .mark { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); font-weight: 700; }
/* selected check for side-by-side buttons is a corner badge: it takes no space, so nothing resizes or re-wraps */
.choices.cols-5 .choice[aria-checked="true"]::after, .choices.cols-4 .choice[aria-checked="true"]::after,
.choices.cols-3 .choice[aria-checked="true"]::after,
.choices.cols-2 .choice[aria-checked="true"]::after {
  content: "\2713"; position: absolute; top: -0.5rem; right: -0.35rem; width: 1.4rem; height: 1.4rem; border-radius: 50%;
  background: var(--xp-dark); color: var(--xp-green); border: 2px solid var(--xp-green);
  font-size: 0.75rem; font-weight: 700; line-height: calc(1.4rem - 4px); text-align: center;
}

/* text inputs: Carmanah boxes with a Superior Green underline, white text */
input[type="text"], input[type="number"], textarea {
  width: 100%; font-family: var(--xp-font); font-size: 1.05rem; color: var(--xp-white);
  background: var(--xp-carmanah); border: 0; border-radius: 0.8rem; caret-color: var(--xp-solar);
  box-shadow: inset 0 -3px 0 var(--xp-green);
  padding: 0.85rem 0.9rem; min-height: 3.4rem; -webkit-appearance: none; appearance: none;
}
textarea { min-height: 6.5rem; resize: vertical; }
input:focus, textarea:focus, .choice:focus-visible, .link-btn:focus-visible, button:focus-visible {
  outline: 3px solid var(--xp-solar); outline-offset: 2px;
}
.other-input { margin-top: 0.9rem; padding-left: 0.8rem; border-left: 3px solid var(--xp-carmanah); }
.other-input .sub-q { margin-top: 0; }

.unit-row { display: flex; align-items: center; gap: 0.6rem; }
.unit-row .prefix, .unit-row .suffix { font-weight: 600; font-size: 1.05rem; }
.unit-row input.light-input { flex: 0 0 6rem; width: 6rem; text-align: center; font-size: 1.05rem; font-weight: 400; padding: 0.85rem 0.4rem; }

.warn {
  margin-top: 0.7rem; background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem;
}
.warn .choices { margin-top: 0.6rem; }
.warn .choice { background: var(--xp-dark); }
.warn .choice[aria-checked="true"] { background: var(--xp-green); }

/* photo checklist */
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
.photo-count { font-weight: 600; font-size: 0.95rem; }
.check {
  display: flex; align-items: center; gap: 0.7rem; width: 100%;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.95rem; text-align: left;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 2.9rem; padding: 0.35rem 0.8rem; margin-bottom: 0.35rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.check .box {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border: 2px solid var(--xp-white); border-radius: 0.35rem;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1;
}
.check[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.check[aria-checked="true"] .box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); }

/* install-location groups (ONT, router, each XWH): no box, just a quiet Carmanah rule down the side */
.device-card { border-left: 3px solid var(--xp-carmanah); padding: 0; margin-bottom: 1.8rem; }
.device-head { padding: 0.1rem 0.9rem 0.2rem; }
.device-head .q { margin: 0; }
.device-body { padding: 0.4rem 0.9rem 0.4rem; }
.device-rule { border: 0; margin: 0.4rem 0 0; }
.device-body .light-block { margin: 0.9rem 0 0; padding: 0; }
.device-body .light-block.has-error { padding-left: 0.4rem; margin-left: -0.9rem; margin-top: 0.9rem; }
.field.device-card.has-error { border-left: 0.5rem solid var(--xp-orange); padding-left: 0; margin-left: 0; }

/* discreet tick box (own router, splice already done, reused patch) */
.mini-check-wrap { margin-top: 1rem; padding-top: 0.2rem; }
.mini-check {
  display: flex; align-items: center; gap: 0.6rem; width: 100%; min-height: 2.9rem; padding: 0.3rem 0;
  font-family: var(--xp-font); font-weight: 400; font-size: 0.95rem; text-align: left; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-box {
  flex: 0 0 1.4rem; width: 1.4rem; height: 1.4rem; border: 2px solid var(--xp-white); border-radius: 0.3rem;
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; line-height: 1;
}
.mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }

/* validation */
.field.has-error { border-left: 0.4rem solid var(--xp-orange); padding-left: 0.4rem; margin-left: -0.8rem; }
.field-error-msg { font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; }
.field-error-msg::before { content: "\26A0  "; color: var(--xp-orange); }


/* must-explain box for missing photos */
.need-reason {
  margin-top: 0.8rem; background: var(--xp-carmanah); border-left: 0.5rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.9rem;
}
.need-reason strong { display: block; font-size: 1.05rem; margin-bottom: 0.4rem; }
.need-reason textarea { background: var(--xp-dark); box-shadow: inset 0 -3px 0 var(--xp-orange); }

/* output */
#output-wrap { margin-top: 1.2rem; }
#output-box {
  background: var(--xp-carmanah); color: var(--xp-white); border-radius: 1rem; padding: 1rem;
  white-space: pre-wrap; font-size: 1rem; line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}

/* buttons: Superior Green main button that brightens to Solar Wind once every answer is in */
button.btn {
  font-family: var(--xp-font); font-weight: 700; font-size: 1.1rem; border-radius: 0.8rem;
  padding: 0.9rem 1rem; min-height: 3.5rem; cursor: pointer; border: 0;
  -webkit-tap-highlight-color: transparent;
}
button.btn.primary { background: var(--xp-green); color: var(--xp-dark); }
button.btn.primary.ready { background: var(--xp-solar); }
button.btn.primary:active { background: var(--xp-solar); }

button.btn.done { background: var(--xp-green); color: var(--xp-dark); }

.sticky-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--xp-dark);
  box-shadow: 0 -10px 18px 4px var(--xp-dark);
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom, 0px));
}
/* compact on purpose: it is always on screen */
.sticky-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; display: grid; gap: 0.5rem; }
.sticky-inner .btn, .sticky-inner > .link-btn { white-space: nowrap; }
.sticky-inner .btn { min-height: 3.1rem; font-size: 1rem; padding: 0.55rem 0.8rem; }
.sticky-inner.edit { grid-template-columns: 1fr auto; }
.sticky-inner > .link-btn { background: var(--xp-carmanah); font-size: 0.8rem; min-height: 3.1rem; padding: 0 0.75rem; border-radius: 0.8rem; }
/* very narrow phones: stack the two buttons instead of squeezing them */
@media (max-width: 350px) { .sticky-inner.edit { grid-template-columns: 1fr; } .sticky-inner > .link-btn { min-height: 2.8rem; } }
.sticky-inner .row { display: flex; gap: 0.5rem; }
.sticky-inner .row .btn { flex: 1; min-height: 2.8rem; font-size: 0.9rem; }
.next-step { font-weight: 600; font-size: 0.95rem; margin: 0.8rem 0 0; }

/* confirm dialog */
.overlay { position: fixed; inset: 0; background: rgba(0,43,43,.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.dialog { background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-carmanah); border-radius: 1rem; padding: 1.2rem; max-width: 26rem; width: 100%; }
.dialog p { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
.dialog .row { display: grid; gap: 0.6rem; }

footer.app-footer { margin-top: 2rem; padding-top: 0.8rem; font-size: 0.75rem; color: var(--xp-green); text-align: center; }

/* phone held sideways: put the bottom buttons side by side so they don't eat the screen */
@media (max-height: 520px) {
  .sticky-inner.output { grid-template-columns: repeat(3, 1fr); }
  .sticky-inner.output .row { display: contents; }
  .sticky-inner.output .row .btn { min-height: 3.1rem; font-size: 1rem; }
}

/* ---- theme switch (sits in the North Shore header, so it looks the same in both themes) ---- */
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.theme-switch {
  display: inline-flex; align-items: center; gap: 0.55rem; min-height: 2.75rem; padding: 0 0.2rem 0 0.6rem;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem; color: var(--xp-white);

}

.theme-switch[aria-checked="true"] .ts-track { background: var(--xp-green); }

:root[data-xp-theme="light"] input[type="text"], :root[data-xp-theme="light"] input[type="number"], :root[data-xp-theme="light"] textarea,
:root[data-xp-theme="light"] .card.tech-card input[type="text"] { background: var(--xp-white); color: var(--xp-dark); caret-color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }

:root[data-xp-theme="light"] #output-box { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-xp-theme="light"] button.btn.primary { background: var(--xp-dark); color: var(--xp-white); }

:root[data-xp-theme="light"] button.btn.secondary { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-xp-theme="light"] button.btn.done { background: var(--xp-green); color: var(--xp-dark); }
:root[data-xp-theme="light"] .sticky-bar { background: var(--xp-white); box-shadow: 0 -10px 18px 4px var(--xp-white); }
:root[data-xp-theme="light"] .sticky-inner > .link-btn { background: var(--xp-white); }
:root[data-xp-theme="light"] .dialog { background: var(--xp-white); color: var(--xp-dark); border-color: var(--xp-carmanah); }
:root[data-xp-theme="light"] footer.app-footer { color: var(--xp-carmanah); }

/* ---- light theme, option A "soft mint" (chosen by the owner): pale mint page, white tiles with a soft shadow, picked = Superior Green ---- */
:root[data-xp-theme="light"] { --xp-mint: #F2F8F4; --xp-soft-line: #C7D9CF; --xp-lift: 0 1px 3px rgba(0,43,43,.22); background: var(--xp-mint); }

:root[data-xp-theme="light"] .choice, :root[data-xp-theme="light"] .check, :root[data-xp-theme="light"] .link-btn, :root[data-xp-theme="light"] button.btn.secondary, :root[data-xp-theme="light"] .notice, :root[data-xp-theme="light"] .card.tech-card, :root[data-xp-theme="light"] .warn, :root[data-xp-theme="light"] .need-reason, :root[data-xp-theme="light"] #output-box, :root[data-xp-theme="light"] .warn .choice { background: var(--xp-white); box-shadow: var(--xp-lift); }

@media (min-width: 62rem) { .layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 2.2rem; } }
.preview-col { position: sticky; top: 1rem; align-self: start; }
@media (max-width: 61.99rem) { .preview-col { position: static; } }
.preview-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 1.1rem; }
.preview-card h2 { margin-bottom: 0.7rem; }
.preview-card #output-box { background: var(--xp-dark); border-radius: 0.8rem; padding: 0.9rem 1rem; font-size: 0.92rem; line-height: 1.5; max-height: calc(100vh - 14rem); overflow: auto; font-family: var(--xp-font); }

body { padding-bottom: 2rem; }

@media (max-width: 40rem) { .field-row, .field-row.loc-row, .field-row.date-row { grid-template-columns: minmax(0, 1fr); gap: 0; } }

@media (max-width: 34rem) { .tick-grid { grid-template-columns: minmax(0, 1fr); } }
.tick-row .mini-check { width: auto; }
.sub-block { margin: 0.6rem 0 0 0.3rem; padding-left: 0.9rem; border-left: 3px solid var(--xp-carmanah); }
.indent { margin-left: 2rem; }
.indent .other-input { margin-top: 0; }

.unit-row { min-width: 0; }
input[type="date"] { width: 100%; font-family: var(--xp-font); font-size: 1.05rem; color: var(--xp-white); background: var(--xp-carmanah); border: 0; border-radius: 0.8rem; box-shadow: inset 0 -3px 0 var(--xp-green); padding: 0.85rem 0.9rem; min-height: 3.4rem; color-scheme: dark; }
/* a tight row of buttons (5 across) needs less padding on desktop widths too */
.choices.cols-5 .choice { font-size: 0.88rem; }
:root[data-xp-theme="light"] input[type="date"] { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-soft-line); color-scheme: light; }

var APP_VERSION = '0.7.0';
/* ===================== helpers ===================== */
function $(id) { return document.getElementById(id); }

function el(tag, attrs, children) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'text') node.textContent = attrs[k];
    else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
};

function str(v) { return String(v === undefined || v === null ? '' : v).trim(); }
function cap(t) { t = str(t); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ''; }
function lowerFirst(t) { t = str(t); return t ? t.charAt(0).toLowerCase() + t.slice(1) : ''; }
function titleCase(t) { return String(t).replace(/(^|\s)([a-z]+)/g, function (m, a, w) { return (w === 'of' || w === 'to' || w === 'a' || w === 'the') ? m : a + w.charAt(0).toUpperCase() + w.slice(1); }); }

/* ===================== state ===================== */

var STATE = {};
var ERRORS = [];          // [{id, msg}]
var COPIED = false;
var PENDING_FOCUS = null; // field id whose "Other" box should grab focus after the next render

function loadDraft() {
  var raw = store.get(DRAFT_KEY);
  if (!raw) return false;
  try {
    var parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object' && Object.keys(parsed).length) {
      if (!parsed.tech && (parsed.platform === 'FWN' || parsed.platform === 'LTE')) parsed.tech = 'Fixed Wireless';   // drafts from before technologies
      STATE = parsed; return true;
    }
  } catch (e) {}
  return false;
}
function saveDraft() { store.set(DRAFT_KEY, JSON.stringify(STATE)); }

function T() { return TECHS[STATE.tech] || null; }
function techId() { return T() ? T().id : ''; }
function DIAG() { return T() ? T().diagnosed : []; }
function INSTR() { return T() ? T().instructions : []; }

var ETH = ['No Link', '10Mbps', '100Mbps', '1000Mbps', '2500Mbps'];
var ETH_FAIL = ['No Link', '10Mbps', '100Mbps'];  // anything below 1000Mbps is failing QOS: shown as "100Mbps (Fail)"
var ETH_BAD = ETH_FAIL;                           // also ticks "Ethernet link issues" for the agent
var SITE = ['Dog must be put away prior', 'Gate at driveway', 'Requires tower climb'];   // tower climb is Fixed Wireless only

/* ===================== error handling ===================== */
function errFor(id) { for (var i = 0; i < ERRORS.length; i++) if (ERRORS[i].id === id) return ERRORS[i]; return null; }

function jumpTo(id) {
  var node = document.querySelector('[data-field-id="' + id + '"]');
  if (!node) return;
  node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  var focusable = node.querySelector('input, textarea, button');
  if (focusable) { try { focusable.focus({ preventScroll: true }); } catch (e) {} }
}

function clearError(id) {
  var before = ERRORS.length;
  ERRORS = ERRORS.filter(function (e) { return e.id !== id; });
  if (ERRORS.length === before) return;
  var node = document.querySelector('[data-field-id="' + id + '"]');
  if (node) {
    node.classList.remove('has-error');
    var msgs = node.querySelectorAll('.field-error-msg');
    for (var i = 0; i < msgs.length; i++) { if (msgs[i].closest('[data-field-id]') === node) { msgs[i].remove(); break; } }
  }
}

/* a change was made by the agent */
function changed(fieldId, rerender) {
  saveDraft();
  if (fieldId) clearError(fieldId);
  COPIED = false;
  if (rerender) render();
  updatePreview();
}

/* ===================== field builders ===================== */
function fieldWrap(id, label, optional, hint, controls, extraClass) {
  var e = errFor(id);
  var wrap = el('div', { class: 'field' + (extraClass ? ' ' + extraClass : '') + (e ? ' has-error' : ''), 'data-field-id': id });
  if (label) wrap.appendChild(el('span', { class: 'q' }, [label, optional ? el('span', { class: 'opt', text: ' (optional)' }) : null]));
  if (hint) wrap.appendChild(el('p', { class: 'hint', text: hint }));
  controls.forEach(function (c) { if (c) wrap.appendChild(c); });
  if (e) wrap.appendChild(el('div', { class: 'field-error-msg', text: e.msg }));
  return wrap;
}

function choiceGroup(key, options, cols, fieldId, afterChange) {
  var group = el('div', { class: 'choices' + (cols ? ' cols-' + cols : ''), role: 'radiogroup' });
  options.forEach(function (o) {
    var selected = STATE[key] === o;
    group.appendChild(el('button', {
      type: 'button', class: 'choice', role: 'radio', 'aria-checked': selected ? 'true' : 'false',
      onclick: function () {
        STATE[key] = o;
        if (o === 'Other') PENDING_FOCUS = fieldId;
        if (afterChange) afterChange(o);
        changed(fieldId, true);
      }
    }, [el('span', { class: 'mark', text: selected ? '✓' : '' }), el('span', { text: titleCase(o) })]));
  });
  return group;
}

function otherInput(key, fieldId, label, placeholder) {
  var inp = el('input', { type: 'text', 'aria-label': label, autocomplete: 'off', placeholder: placeholder || '' });
  inp.value = STATE[key] || '';
  inp.addEventListener('input', function () { STATE[key] = inp.value; changed(fieldId, false); });
  return el('div', { class: 'other-input' }, [el('p', { class: 'sub-q', text: label }), inp]);
}

function choiceField(o) {
  // o: {id, key, label, hint, options, cols, otherLabel, otherPlaceholder, optional, after, extra}
  var controls = [choiceGroup(o.key, o.options, o.cols, o.id, o.after)];
  if (o.otherLabel && STATE[o.key] === 'Other') controls.push(otherInput(o.key + '_other', o.id, o.otherLabel, o.otherPlaceholder));
  (o.extra || []).forEach(function (x) { controls.push(x); });
  return fieldWrap(o.id, o.label, o.optional, o.hint, controls);
}

/* tick boxes; STATE[key] holds {option: true|false} */
function tickBox(key, o, fieldId, labelText, afterToggle) {
  if (!STATE[key] || typeof STATE[key] !== 'object') STATE[key] = {};
  var on = STATE[key][o] === true;
  return el('button', {
    type: 'button', class: 'mini-check', role: 'checkbox', 'aria-checked': on ? 'true' : 'false',
    onclick: function () { STATE[key][o] = !on; if (afterToggle) afterToggle(!on); changed(fieldId, true); }
  }, [el('span', { class: 'mini-box', text: on ? '✓' : '' }), el('span', { text: labelText || o })]);
}
function isOffline() { return !!(T() && STATE.diagnosed && STATE.diagnosed[T().offline] === true); }
function ticked(key, options) { var s = STATE[key] || {}; return options.filter(function (o) { return s[o] === true; }); }
function isOn(key, o) { return !!(STATE[key] && STATE[key][o] === true); }

function textInput(id, key, label, o) {
  // o: {type, placeholder, suffix, hint, optional, inputmode, small}
  o = o || {};
  var inp = el('input', { type: o.type || 'text', 'aria-label': label, autocomplete: 'off', placeholder: o.placeholder || '' });
  if (o.inputmode) inp.setAttribute('inputmode', o.inputmode);
  inp.value = STATE[key] || '';
  inp.addEventListener('input', function () { STATE[key] = inp.value; changed(id, false); });
  var ctrl = o.suffix ? el('div', { class: 'unit-row' }, [inp, el('span', { class: 'suffix', text: o.suffix })]) : inp;
  return fieldWrap(id, label, o.optional, o.hint, [ctrl], o.small ? 'small' : '');
}

function lastOnlineInput() {
  var inp = el('input', { type: 'text', 'aria-label': 'Last Online (optional)', autocomplete: 'off', placeholder: 'Last online (optional), e.g. 4 days ago' });
  inp.value = STATE.last_online || '';
  inp.addEventListener('input', function () { STATE.last_online = inp.value; changed('diagnosed', false); });
  return inp;
}

function linesBox(key, fieldId, label, placeholder) {
  var ta = el('textarea', { 'aria-label': label, placeholder: placeholder || '', rows: '2' });
  ta.value = STATE[key] || '';
  ta.addEventListener('input', function () { STATE[key] = ta.value; changed(fieldId, false); });
  return el('div', { class: 'lines-box' }, [el('p', { class: 'sub-q', text: label }), ta]);
}
/* each typed line becomes one bullet; a leading "-" or "•" is ignored */
function linesOf(key) {
  return str(STATE[key]).split('\n').map(function (l) { return cap(l.replace(/^\s*[-•*]\s*/, '')); }).filter(Boolean);
}

function row(children, cls) { return el('div', { class: 'field-row' + (cls ? ' ' + cls : '') }, children); }

/* ===================== the form ===================== */
function platformField() {
  var tc = T();
  return choiceField({ id: 'platform', key: 'platform', label: 'Platform', options: tc.platforms, cols: tc.platforms.length,
    after: function (o) { if (tc.id === 'fw' && STATE.plan && STATE.plan.indexOf(o + '-') !== 0) STATE.plan = ''; } });
}
function planField() {
  if (techId() !== 'fw') return textInput('plan', 'plan', 'Customer Speed Plan', { placeholder: 'e.g. plan name or speed' });
  if (!STATE.platform) return fieldWrap('plan', 'Customer Speed Plan', false, 'Choose a platform first.', []);
  return choiceField({ id: 'plan', key: 'plan', label: 'Customer Speed Plan', options: PLANS[STATE.platform], cols: 3 });
}
function ethField() {
  return choiceField({ id: 'eth', key: 'eth', label: 'Ethernet Link', options: ETH, cols: 5,
    after: function (o) {   // a bad link ticks "Ethernet link issues" unless the agent has already chosen
      if (ETH_BAD.indexOf(o) >= 0 && (!STATE.diagnosed || STATE.diagnosed['Ethernet link issues'] === undefined)) { STATE.diagnosed = STATE.diagnosed || {}; STATE.diagnosed['Ethernet link issues'] = true; clearError('diagnosed'); }
    } });
}
function locField(afterFn) {
  var tc = T();
  return choiceField({ id: 'loc', key: 'loc', label: tc.locLabel, options: tc.locations, cols: 5, otherLabel: tc.locLabel, otherPlaceholder: tc.locPlaceholder, after: afterFn });
}

/* questions that are specific to one technology: [before Ethernet Link, after it] */
function techConnection() {
  var id = techId(), lbl = isOffline() ? 'Last Known ' : 'Current ';
  if (id === 'fw') return [[
    function () {
      return row([
        textInput('tower', 'tower', 'Tower', { placeholder: 'e.g. Hampstead', hint: isOffline() ? 'Last known.' : null }),
        textInput('panel', 'panel', 'Panel', { placeholder: 'e.g. 3E71CC003', hint: isOffline() ? 'Last known.' : null })
      ]);
    },
    function () {
      return row([
        textInput('rsrp', 'rsrp', lbl + 'RSRP', { placeholder: '-108', inputmode: 'numeric', suffix: 'dBm' }),
        textInput('sinr', 'sinr', lbl + 'SINR', { placeholder: '5', inputmode: 'numeric', suffix: 'dB' })
      ]);
    }
  ], [
    function () {
      return row([
        locField(function (o) { if (o === 'Tower' && (!STATE.site || STATE.site['Requires tower climb'] === undefined)) { STATE.site = STATE.site || {}; STATE.site['Requires tower climb'] = true; } }),
        textInput('height', 'height', 'Height', { placeholder: '25', inputmode: 'numeric', suffix: 'ft', small: true })
      ], 'loc-row');
    },
    function () { return fieldWrap('celllock', null, false, null, [tickBox('celllock', 'Verified', 'celllock', 'Cell lock checked: CPE is on the best possible panel')]); }
  ]];
  if (id === 'ftth') return [[
    function () { return textInput('pon', 'pon', 'OLT / PON', { optional: true, placeholder: 'e.g. OLT1 1/2/3' }); },
    function () { return textInput('ont_light', 'ont_light', lbl + 'ONT Light Level', { placeholder: '-18', inputmode: 'numeric', suffix: 'dBm' }); }
  ], [function () { return locField(); }]];
  return [[
    function () { return textInput('beam', 'beam', 'Beam', { optional: true, placeholder: 'e.g. 25' }); }
  ], [function () { return locField(); }]];
}

function buildSections() {
  var secs = [{ title: 'Work Order', fields: [
    function () {
      return choiceField({ id: 'tech', key: 'tech', label: 'Technology', options: TECH_NAMES, cols: 3,
        hint: T() ? null : 'Choose the technology to start. Each one has its own questions.',
        after: function (o) {   // anything that belongs to the other technology is cleared
          if (STATE.platform && TECHS[o].platforms.indexOf(STATE.platform) < 0) { STATE.platform = ''; STATE.plan = ''; }
          if (TECHS[o].locations.indexOf(STATE.loc) < 0) { STATE.loc = ''; STATE.loc_other = ''; }
        } });
    }
  ]}];
  if (!T()) return secs;

  secs[0].fields.push(function () {
    return choiceField({ id: 'type', key: 'type', label: 'Repair Type', options: REPAIR_TYPES, cols: 4,
      otherLabel: 'Repair Type', otherPlaceholder: 'e.g. Equipment damaged',
      after: function (o) {   // tick the matching customer issue if nothing is ticked yet
        if (REPORTED.indexOf(o) >= 0 && ticked('reported', REPORTED).length === 0) { STATE.reported = STATE.reported || {}; STATE.reported[o] = true; clearError('reported'); }
      } });
  });
  secs[0].fields.push(function () {
    var on = STATE.repeat === true;
    var box = el('button', {
      type: 'button', class: 'mini-check', role: 'checkbox', 'aria-checked': on ? 'true' : 'false',
      onclick: function () { STATE.repeat = !on; changed('repeat', true); }
    }, [el('span', { class: 'mini-box', text: on ? '✓' : '' }), el('span', { text: 'Repeat work order' })]);
    var kids = [box];
    if (on) {
      kids.push(el('div', { class: 'sub-block' }, [
        choiceField({ id: 'rep_kind', key: 'rep_kind', label: 'Type of Repeat', options: REPEAT_KINDS, cols: 4 }),
        row([
          textInput('rep_date', 'rep_date', 'Tech Last On Site', { type: 'date' }),
          choiceField({ id: 'rep_for', key: 'rep_for', label: 'For', options: LAST_VISIT, cols: 5, otherLabel: 'Purpose of Last Visit', otherPlaceholder: 'e.g. realignment' })
        ], 'date-row')
      ]));
    }
    return fieldWrap('repeat', null, false, null, kids, 'tight-top');
  });

  secs.push({ title: 'Diagnosis', fields: [
    function () {
      return fieldWrap('reported', 'Reported by Customer', false, 'List it even if it differs from what support found, so the tech knows what the customer expects.', [
        el('div', { class: 'tick-grid' }, REPORTED.map(function (o) { return tickBox('reported', o, 'reported'); })),
        linesBox('reported_more', 'reported', 'Customer Details (one per line)', 'e.g. Internet works for a few hours, then drops out seemingly randomly')
      ]);
    },
    function () {
      return fieldWrap('diagnosed', 'Diagnosed by Support', false, 'The tech must fix each item or address it in their completion comments.', [
        el('div', { class: 'tick-grid' }, DIAG().reduce(function (cells, o) {
          cells.push(tickBox('diagnosed', o, 'diagnosed'));
          if (o === T().offline) cells.push(isOffline() ? lastOnlineInput() : el('div'));   // sits beside it, so nothing jumps
          return cells;
        }, [])),
        isOn('diagnosed', 'Other') ? linesBox('diagnosed_more', 'diagnosed', 'Other Findings (one per line)', 'e.g. Signal dropped after windstorm') : null
      ]);
    }
  ]});
  secs.push({ title: 'Specific Instructions', optional: STATE.repeat !== true, fields: [
    function () {
      return fieldWrap('instr', null, false, STATE.repeat === true ? 'Required for repeat work orders.' : 'Only if needed. Always use for repeat work orders.', [
        el('div', {}, INSTR().map(function (o) { return tickBox('instr', o, 'instr'); })),
        linesBox('instr_more', 'instr', 'Other Instructions (one per line)', T().instrPlaceholder)
      ]);
    }
  ]});

  var tc = techConnection();
  secs.push({ title: 'Connection Details', fields: [platformField, planField].concat(tc[0], [ethField], tc[1]) });

  secs.push({ title: 'Site Restrictions', optional: true, fields: [
    function () {
      var kids = [];
      kids.push(tickBox('site', SITE[0], 'site'));
      if (isOn('site', SITE[0])) kids.push(el('div', { class: 'indent' }, [tickBox('site', 'Aggressive', 'site', 'Aggressive dog')]));
      kids.push(tickBox('site', SITE[1], 'site'));
      if (isOn('site', SITE[1])) kids.push(el('div', { class: 'indent' }, [otherInput('gate_code', 'site', 'Gate Code (optional)', 'e.g. 6543')]));
      if (techId() === 'fw') kids.push(tickBox('site', SITE[2], 'site'));
      kids.push(linesBox('site_more', 'site', 'Other Restrictions (one per line)', 'e.g. Call 30 minutes before arrival'));
      return fieldWrap('site', null, false, null, kids);
    }
  ]});
  return secs;
}

function render() {
  var y = window.pageYOffset;
  var mount = $('form-mount');
  mount.innerHTML = '';
  buildSections().forEach(function (sec) {
    var s = el('section', { class: 'form-section' }, [el('h2', { class: 'form-section-title' }, [sec.title, sec.optional ? el('span', { class: 'opt', text: ' (optional)' }) : null])]);
    sec.fields.forEach(function (f) { s.appendChild(f()); });
    mount.appendChild(s);
  });
  window.scrollTo(0, y);
  if (PENDING_FOCUS) {
    var target = document.querySelector('[data-field-id="' + PENDING_FOCUS + '"] .other-input input');
    PENDING_FOCUS = null;
    if (target) target.focus();
  }
}

/* ===================== values used by both the output and the checks ===================== */
function chosen(key) { return STATE[key] === 'Other' ? cap(STATE[key + '_other']) : (STATE[key] || ''); }
function numberText(v) { return str(v).replace(/\s+/g, '').replace(/[^0-9.\-]/g, ''); }
function negText(v) { var n = numberText(v); if (!n || n === '-') return ''; return n.charAt(0) === '-' ? n : '-' + n; }   // light and signal levels are always negative
function rsrpText() { return negText(STATE.rsrp); }
function isNum(n) { return n !== '' && !isNaN(Number(n)); }

var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var MONTHS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function ordinal(d) { var s = ['th', 'st', 'nd', 'rd'], v = d % 100; return d + (s[(v - 20) % 10] || s[v] || s[0]); }
function dateText(v, lang) {   // "2026-08-08" -> "August 8th" / "8 août"
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(v));
  if (!m) return '';
  var d = Number(m[3]), mo = Number(m[2]) - 1;
  return lang === 'fr' ? (d === 1 ? '1er' : d) + ' ' + MONTHS_FR[mo] : MONTHS[mo] + ' ' + ordinal(d);
}

var FR_LAST_VISIT = { 'Install': "l'installation", 'Conversion': 'la conversion', '1st Repair': 'la 1re réparation', '2nd Repair': 'la 2e réparation' };
function tr(lang, text) { return lang === 'fr' && FR[text] ? FR[text] : text; }
function chosenT(key, lang) { return STATE[key] === 'Other' ? cap(STATE[key + '_other']) : tr(lang, STATE[key] || ''); }
function agoText(v, lang) {   // "4 days ago" -> "il y a 4 jours"
  var m = /^(\d+)\s*(day|hour|week|month)s?\s+ago$/i.exec(v);
  if (!m || lang !== 'fr') return null;
  var u = { day: 'jour', hour: 'heure', week: 'semaine', month: 'mois' }[m[2].toLowerCase()];
  return 'il y a ' + m[1] + ' ' + u + (Number(m[1]) > 1 && u !== 'mois' ? 's' : '');
}

function reportedItems(lang) { return ticked('reported', REPORTED).map(function (o) { return tr(lang, o); }).concat(linesOf('reported_more')); }
function diagnosedItems(lang) {
  var fr = lang === 'fr', out = [];
  ticked('diagnosed', DIAG()).forEach(function (o) {
    if (o === 'Other') return;   // its typed lines are added below
    if (o === T().offline) {
      out.push(tr(lang, o));
      var lo = str(STATE.last_online);
      if (lo) out.push(/^(last|derni)/i.test(lo) ? cap(lo) : fr ? 'Dernière connexion ' + (agoText(lo, 'fr') || ': ' + lo) : 'Last online ' + lo);
    } else if (o === 'Ethernet link issues' && STATE.eth === 'No Link') out.push(fr ? 'Aucun lien Ethernet, problème de câblage soupçonné' : 'No ethernet link, suspected cabling issues');
    else if (o === 'Ethernet link issues' && ETH_FAIL.indexOf(STATE.eth) >= 0) out.push(fr ? 'Lien Ethernet à ' + STATE.eth + ', problème de câblage soupçonné' : 'Ethernet link at ' + STATE.eth + ', suspected cabling issues');
    else out.push(tr(lang, o));
  });
  return isOn('diagnosed', 'Other') ? out.concat(linesOf('diagnosed_more')) : out;
}
function instructionItems(lang) { return ticked('instr', INSTR()).map(function (o) { return tr(lang, o); }).concat(linesOf('instr_more')); }
function siteItems(lang) {
  var fr = lang === 'fr', out = [];
  if (techId() === 'fw' && isOn('site', SITE[2])) out.push(tr(lang, SITE[2]));   // tower climb first: the tech needs to plan for it
  if (isOn('site', SITE[0])) {
    var ag = isOn('site', 'Aggressive');
    out.push(fr ? (ag ? "Chien agressif, doit être mis à l'écart avant l'arrivée" : "Le chien doit être mis à l'écart avant l'arrivée") : (ag ? 'Aggressive dog must be put away prior' : SITE[0]));
  }
  if (isOn('site', SITE[1])) { var c = str(STATE.gate_code).replace(/^#/, ''); out.push(fr ? "Barrière à l'entrée de la cour" + (c ? ', code #' + c : '') : (c ? 'Gate at driveway, code #' + c : SITE[1])); }
  return out.concat(linesOf('site_more'));
}

/* ===================== validation ===================== */
function validate() {
  var issues = [];
  function need(id, ok, msg) { if (!ok) issues.push({ id: id, msg: msg || 'Please choose an answer.' }); }
  var otherOk = function (k) { return !!STATE[k] && (STATE[k] !== 'Other' || !!str(STATE[k + '_other'])); };

  need('tech', !!T(), 'Choose the technology.');
  if (!T()) return issues;
  var id = techId();

  need('type', otherOk('type'), 'Choose the repair type, or type it if you chose Other.');
  if (STATE.repeat === true) {
    need('rep_kind', otherOk('rep_kind'), 'Choose the type of repeat.');
    need('rep_date', !!dateText(STATE.rep_date), 'Enter the date a tech was last on site.');
    need('rep_for', otherOk('rep_for'), 'Choose what the last visit was for.');
  }
  need('reported', reportedItems().length > 0, 'Tick or type at least one issue the customer reported.');
  need('diagnosed', diagnosedItems().length > 0 && !(isOn('diagnosed', 'Other') && linesOf('diagnosed_more').length === 0), isOn('diagnosed', 'Other') && linesOf('diagnosed_more').length === 0 ? 'Type the other finding, or untick Other.' : 'Tick at least one finding.');
  if (STATE.repeat === true) need('instr', instructionItems().length > 0, 'Repeat work orders need at least one instruction.');

  need('platform', T().platforms.indexOf(STATE.platform) >= 0);
  if (id === 'fw') need('plan', (PLANS[STATE.platform] || []).indexOf(STATE.plan) >= 0, STATE.platform ? 'Please choose the customer speed plan.' : 'Choose a platform, then the speed plan.');
  else need('plan', !!str(STATE.plan), 'Enter the customer speed plan.');
  if (id === 'fw') {
    need('tower', !!str(STATE.tower), 'Enter the tower.');
    need('panel', !!str(STATE.panel), 'Enter the panel.');
    need('rsrp', isNum(negText(STATE.rsrp)), 'Enter the RSRP as a number, e.g. -108.');
    need('sinr', isNum(numberText(STATE.sinr)), 'Enter the SINR as a number, e.g. 5.');
    need('celllock', isOn('celllock', 'Verified'), 'Confirm the cell lock check before copying.');
    need('height', isNum(numberText(STATE.height)), 'Enter the CPE height in feet.');
  }
  if (id === 'ftth') need('ont_light', isNum(negText(STATE.ont_light)), 'Enter the ONT light level as a number, e.g. -18.');
  need('eth', !!STATE.eth);
  need('loc', otherOk('loc') && (STATE.loc === 'Other' || T().locations.indexOf(STATE.loc) >= 0), 'Choose the ' + T().locLabel.toLowerCase() + ', or type it if you chose Other.');
  return issues;
}

/* ===================== output =====================
   mark=true is the live preview: anything still missing shows as a ⟦placeholder⟧. */
var MISS_OPEN = '⟦', MISS_CLOSE = '⟧';
function buildOutput(mark, lang) {
  var fr = lang === 'fr';
  function t(en, frText) { return fr ? frText : en; }
  function m(label) { return mark ? MISS_OPEN + label + MISS_CLOSE : ''; }
  function or(v, label) { return str(v) ? v : m(label); }
  var L = [];
  function section(title, items, required, missLabel) {
    if (!items.length && !(required && mark)) return;
    L.push('', title);
    if (!items.length) L.push('- ' + m(missLabel));
    items.forEach(function (i) { L.push('- ' + i); });
  }

  if (!T()) return m('Technology');
  L.push(or(STATE.platform, 'Platform') + ' - ' + t('Repair', 'Réparation') + ' - ' + or(chosenT('type', lang), 'Repair type'));

  if (STATE.repeat === true) {
    var n = STATE.rep_kind ? parseInt(STATE.rep_kind, 10) : '';
    var kind = !n ? m('Type of repeat') + t(' repeat work order', '') : t(n + ' day repeat work order', 'Bon de travail répété de ' + n + ' jours');
    var lastFor = STATE.rep_for === 'Other' ? or(lowerFirst(STATE.rep_for_other), 'Purpose')
      : STATE.rep_for ? t(STATE.rep_for.toLowerCase(), FR_LAST_VISIT[STATE.rep_for] || STATE.rep_for.toLowerCase()) : m('Purpose');
    L.push('', t('REPEAT WORK ORDER ALERT:', 'ALERTE DE BON DE TRAVAIL RÉPÉTÉ :'));
    L.push('- ' + kind);
    L.push('- ' + t('A tech was last on site ' + or(dateText(STATE.rep_date, lang), 'Date') + ' for ' + lastFor,
                     'Un technicien est passé sur place pour la dernière fois le ' + or(dateText(STATE.rep_date, lang), 'Date') + ' pour ' + lastFor));
    L.push('- ' + t("All efforts should be made to repair customer's service", 'Tous les efforts doivent être déployés pour rétablir le service du client'));
  }

  section(t('ISSUE REPORTED BY CUSTOMER:', 'PROBLÈME SIGNALÉ PAR LE CLIENT :'), reportedItems(lang), true, 'Customer issue');
  section(t('ISSUE DIAGNOSED BY SUPPORT:', 'PROBLÈME DIAGNOSTIQUÉ PAR LE SOUTIEN TECHNIQUE :'), diagnosedItems(lang), true, 'Support finding');
  section(t('SPECIFIC INSTRUCTIONS:', 'INSTRUCTIONS PARTICULIÈRES :'), instructionItems(lang), STATE.repeat === true, 'Instruction');

  var offline = isOffline(), id = techId();
  L.push('', t('CONNECTION DETAILS:', 'DÉTAILS DE CONNEXION :'));
  L.push(t('PLAN: ', 'FORFAIT : ') + or(STATE.plan, 'Speed plan'));
  function eth() { L.push(t('ETHERNET LINK: ', 'LIEN ETHERNET : ') + (STATE.eth ? tr(lang, STATE.eth) + (ETH_FAIL.indexOf(STATE.eth) >= 0 ? t(' (Fail)', ' (Échec)') : '') : m('Ethernet link'))); }
  if (id === 'fw') {
    var r = rsrpText(), sn = numberText(STATE.sinr), h = numberText(STATE.height);
    L.push(t('TOWER: ', 'TOUR : ') + or(str(STATE.tower), 'Tower') + ' - ' + or(STATE.platform, 'Platform'));
    L.push(t('PANEL: ', 'PANNEAU : ') + or(str(STATE.panel).toUpperCase(), 'Panel'));
    L.push((offline ? t('LAST KNOWN SIGNAL: ', 'DERNIER SIGNAL CONNU : ') : t('CURRENT SIGNAL: ', 'SIGNAL ACTUEL : ')) + 'RSRP ' + (r ? r + 'dBm' : m('RSRP')) + ', SINR ' + (sn ? sn + 'dB' : m('SINR')));
    L.push(t('CELL LOCK: ', 'VERROUILLAGE DE CELLULE : ') + (isOn('celllock', 'Verified') ? t('Verified, CPE on best available panel', 'Vérifié, CPE sur le meilleur panneau disponible') : m('Cell lock check')));
    eth();
    L.push(t('CPE LOCATION: ', 'EMPLACEMENT DU CPE : ') + or(chosenT('loc', lang), 'Location') + ', ' + (h ? h + t('ft', ' pi') : m('Height')));
  } else if (id === 'ftth') {
    var lt = negText(STATE.ont_light);
    if (str(STATE.pon)) L.push('OLT / PON: ' + str(STATE.pon));
    L.push((offline ? t('LAST KNOWN ONT LIGHT LEVEL: ', "DERNIER NIVEAU DE LUMIÈRE CONNU DE L'ONT : ") : t('ONT LIGHT LEVEL: ', "NIVEAU DE LUMIÈRE DE L'ONT : ")) + (lt ? lt + 'dBm' : m('Light level')));
    eth();
    L.push(t('ONT LOCATION: ', "EMPLACEMENT DE L'ONT : ") + or(chosenT('loc', lang), 'Location'));
  } else {
    if (str(STATE.beam)) L.push(t('BEAM: ', 'FAISCEAU : ') + str(STATE.beam));
    eth();
    L.push(t('DISH LOCATION: ', "EMPLACEMENT DE L'ANTENNE : ") + or(chosenT('loc', lang), 'Location'));
  }

  section(t('SITE RESTRICTIONS:', 'RESTRICTIONS DU SITE :'), siteItems(lang), false);
  return L.join('\n');
}

/* ===================== language: English, French (Quebec) or both =====================
   The preview and the Copy button follow this choice. */
var LANG_KEY = 'xplore_wod_lang';
var LANGS = [['en', 'English'], ['fr', 'Français'], ['both', 'English + Français']];
function getLang() { var v = store.get(LANG_KEY); return v === 'fr' || v === 'both' ? v : 'en'; }
function fullOutput(mark) {
  var lang = getLang();
  if (lang === 'both') return buildOutput(mark, 'en') + '\n\n----------\n\n' + buildOutput(mark, 'fr');
  return buildOutput(mark, lang);
}
function renderLang() {
  var box = $('lang-switch');
  box.innerHTML = '';
  LANGS.forEach(function (l) {
    var on = getLang() === l[0];
    box.appendChild(el('button', {
      type: 'button', class: 'choice', role: 'radio', 'aria-checked': on ? 'true' : 'false',
      onclick: function () { store.set(LANG_KEY, l[0]); COPIED = false; renderLang(); updatePreview(); }
    }, [el('span', { text: l[1] })]));
  });
}

/* ===================== preview panel ===================== */
function updatePreview() {
  var box = $('output-box');
  box.innerHTML = '';
  var text = fullOutput(true);
  var re = new RegExp(MISS_OPEN + '([^' + MISS_CLOSE + ']*)' + MISS_CLOSE, 'g'), last = 0, mm;
  while ((mm = re.exec(text))) {
    box.appendChild(document.createTextNode(text.slice(last, mm.index)));
    box.appendChild(el('span', { class: 'missing', text: mm[1] }));
    last = re.lastIndex;
  }
  box.appendChild(document.createTextNode(text.slice(last)));

  var left = validate().length;
  var btn = $('copy-btn');
  btn.textContent = COPIED ? 'Copied ✓' : 'Copy Description';
  btn.className = 'btn ' + (COPIED ? 'done' : 'primary') + (left === 0 && !COPIED ? ' ready' : '');
  $('preview-status').textContent = COPIED ? 'Now paste it into the work order.'
    : left === 0 ? 'Ready to copy.'
    : left + (left === 1 ? ' answer' : ' answers') + ' still needed.';
}

function onCopy() {
  ERRORS = validate();
  if (ERRORS.length) {
    render();
    ERRORS.sort(function (a, b) {
      var ea = document.querySelector('[data-field-id="' + a.id + '"]');
      var eb = document.querySelector('[data-field-id="' + b.id + '"]');
      if (!ea || !eb) return 0;
      return (ea.compareDocumentPosition(eb) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
    });
    jumpTo(ERRORS[0].id);
    updatePreview();
    $('preview-status').textContent = 'Fill in the highlighted answers first.';
    return;
  }
  var text = fullOutput(false);
  function ok() { COPIED = true; updatePreview(); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (done) ok();
    else {
      var r = document.createRange(); r.selectNodeContents($('output-box'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      $('preview-status').textContent = 'Could not copy automatically. The text is selected: press Ctrl+C.';
    }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(fallback);
  else fallback();
}

function askConfirm(message, yesLabel, noLabel, onYes) {
  var mount = $('dialog-mount');
  function close() { mount.innerHTML = ''; }
  var yes = el('button', { type: 'button', class: 'btn primary', text: yesLabel, onclick: function () { close(); onYes(); } });
  var no = el('button', { type: 'button', class: 'btn secondary', text: noLabel, onclick: close });
  mount.appendChild(el('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true' }, [
    el('div', { class: 'dialog' }, [el('p', { text: message }), el('div', { class: 'row' }, [yes, no])])
  ]));
  no.focus();
}

function resetJob() {
  STATE = {}; ERRORS = []; COPIED = false;
  store.del(DRAFT_KEY);
  $('draft-notice').classList.add('hidden');
  render(); updatePreview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function onClear() { askConfirm('Clear everything and start a new work order?', 'Yes, Start New', 'No, Keep My Answers', resetJob); }

/* ===================== theme ===================== */
var THEME_KEY = 'xplore_wod_theme';
function applyTheme(t, remember) {
  document.documentElement.setAttribute('data-xp-theme', t);
  var sw = $('theme-switch');
  if (sw) { sw.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false'); $('ts-label').textContent = t === 'dark' ? 'Dark' : 'Light'; }
  if (remember) store.set(THEME_KEY, t);
}
function initTheme() {
  var cur = document.documentElement.getAttribute('data-xp-theme') === 'light' ? 'light' : 'dark';
  applyTheme(cur, false);
  $('theme-switch').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-xp-theme') === 'dark' ? 'light' : 'dark', true);
  });
}

/* ===================== init ===================== */
(function init() {
  initTheme();
  if (loadDraft()) {
    var notice = $('draft-notice');
    notice.classList.remove('hidden');
    notice.appendChild(el('button', { type: 'button', class: 'link-btn', text: 'Start New', onclick: onClear }));
  }
  renderLang();
  $('copy-btn').addEventListener('click', onCopy);
  $('clear-btn').addEventListener('click', onClear);
  render();
  updatePreview();
})();


</script>

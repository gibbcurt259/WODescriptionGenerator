:root {
  /* Xplore brand palette (Brand Guide, Sept 2022), RGB for anything viewed digitally */
  --xp-dark:       #002B2B;   /* North Shore Green 0/43/43 : page background */
  --xp-carmanah:   #306154;   /* Carmanah Green 48/97/84   : tiles, boxes, panels */
  --xp-green:      #58C774;   /* Superior Green 88/199/116 : picked state, rules, section titles */
  --xp-solar:      #00FF57;   /* Solar Wind 0/255/87       : used sparingly (digital only) */
  --xp-white:      #FFFFFF;
  --xp-green-rgb:  88,199,116;
  --xp-dark-rgb:   0,43,43;
  --xp-orange:     #FFB21C;   /* contrast colour: unanswered marker only */
  --xp-font: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Approved pairings only: on North Shore or Carmanah use Superior, Solar Wind or White text;
   on Superior or Solar Wind use North Shore text. */

html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: dark; background: var(--xp-dark); }

*, *::before, *::after { box-sizing: border-box; }

/* no double-tap zoom or tap delay when tapping choices quickly */
button, input, textarea { touch-action: manipulation; }

body {
  font-family: var(--xp-font);
  color: var(--xp-white);
  background: var(--xp-dark);
  margin: 0;
  padding: 0;
  padding-bottom: 12rem;
  line-height: 1.5;
}

h1, h2, h3 { color: var(--xp-white); margin: 0; letter-spacing: -0.01em; }
h1 { font-weight: 700; font-size: 1.15rem; }
h2 { font-weight: 600; font-size: 1.05rem; }

.wrap { max-width: 44rem; margin: 0 auto; padding: 1.1rem 0.9rem 0; }
.hidden { display: none !important; }

/* header: North Shore Green with the Superior Green logo, a quiet Carmanah rule underneath */
header.app-header {
  background: var(--xp-dark); color: var(--xp-white);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 0 1.1rem;
  border-bottom: 2px solid var(--xp-carmanah);
}
.app-header-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; }   /* same box as .wrap, so the left edges match at any width */
header.app-header img { width: 12rem; height: auto; display: block; }
header.app-header h1 { color: var(--xp-white); font-size: 1.45rem; line-height: 1.25; margin-top: 0; }
header.app-header p { margin: 0.3rem 0 0; font-size: 0.9rem; line-height: 1.4; color: var(--xp-white); }

.link-btn {
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem;
  color: var(--xp-white); background: var(--xp-dark);
  border: 2px solid transparent; border-radius: 0.6rem;
  padding: 0.55rem 0.9rem; min-height: 2.8rem; cursor: pointer;
}

.notice {
  background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem; margin-bottom: 1rem;
  display: flex; gap: 0.7rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
}

/* the technician box is a small panel; the form itself sits straight on the page */
.card { margin-bottom: 1rem; }
.card.tech-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 0.9rem; }
.card.tech-card input[type="text"] { background: var(--xp-dark); }
.card-title { margin-bottom: 1.2rem; }

.form-section { margin-bottom: 2.2rem; }
.form-section:last-child { margin-bottom: 0; }
.form-section-title {
  font-size: 1.3rem; font-weight: 700; letter-spacing: 0.005em; color: var(--xp-green);

/* choice buttons: Carmanah tiles, Superior Green when picked */

}

.choices.cols-5, .choices.cols-4 { gap: 0.45rem; }
.choice:active { background: var(--xp-solar); color: var(--xp-dark); }

/* selected check for side-by-side buttons is a corner badge: it takes no space, so nothing resizes or re-wraps */
.choices.cols-5 .choice[aria-checked="true"]::after, .choices.cols-4 .choice[aria-checked="true"]::after,
.choices.cols-3 .choice[aria-checked="true"]::after,

/* text inputs: Carmanah boxes with a Superior Green underline, white text */
input[type="text"], input[type="number"], textarea {

}

.unit-row { display: flex; align-items: center; gap: 0.6rem; }

.warn {

}

/* photo checklist */
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }

.check {
  display: flex; align-items: center; gap: 0.7rem; width: 100%;

}
.check .box {

}

/* install-location groups (ONT, router, each XWH): no box, just a quiet Carmanah rule down the side */
.device-card { border-left: 3px solid var(--xp-carmanah); padding: 0; margin-bottom: 1.8rem; }
.device-head { padding: 0.1rem 0.9rem 0.2rem; }
.device-head .q { margin: 0; }
.device-body { padding: 0.4rem 0.9rem 0.4rem; }

.device-body .light-block { margin: 0.9rem 0 0; padding: 0; }
.device-body .light-block.has-error { padding-left: 0.4rem; margin-left: -0.9rem; margin-top: 0.9rem; }
.field.device-card.has-error { border-left: 0.5rem solid var(--xp-orange); padding-left: 0; margin-left: 0; }

/* discreet tick box (own router, splice already done, reused patch) */
.mini-check-wrap { margin-top: 1rem; padding-top: 0.2rem; }
.mini-check {
  display: flex; align-items: center; gap: 0.6rem; width: 100%; min-height: 2.9rem; padding: 0.3rem 0;
  font-family: var(--xp-font); font-weight: 400; font-size: 0.95rem; text-align: left; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-box {
  flex: 0 0 1.4rem; width: 1.4rem; height: 1.4rem; border: 2px solid var(--xp-white); border-radius: 0.3rem;
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; line-height: 1;
}
.mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }

/* validation */
.field.cell-lock { background: var(--xp-carmanah); border-radius: 1rem; padding: 1rem 1rem 1.4rem; margin-bottom: 1.4rem; }
.field.cell-lock .q { margin-bottom: 0.7rem; }
.field.cell-lock .other-input { margin-top: 0.9rem; }
.field.cell-lock .q { font-size: 1.15rem; }
.field.cell-lock .hint { color: var(--xp-white); font-size: 0.95rem; margin: 0 0 0.4rem; }
.field.cell-lock.has-error { border-left: 0.4rem solid var(--xp-orange); padding-left: 0.8rem; margin-left: 0; }

:root[data-xp-theme="light"] .field.cell-lock .hint { color: var(--xp-dark); }
.field.has-error { border-left: 0.4rem solid var(--xp-orange); padding-left: 0.4rem; margin-left: -0.8rem; }

/* must-explain box for missing photos */

  border-radius: 0.8rem; padding: 0.9rem;
}

/* output */
#output-wrap { margin-top: 1.2rem; }
#output-box {
  background: var(--xp-carmanah); color: var(--xp-white); border-radius: 1rem; padding: 1rem;
  white-space: pre-wrap; font-size: 1rem; line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}

/* buttons: Superior Green main button that brightens to Solar Wind once every answer is in */
button.btn {
  font-family: var(--xp-font); font-weight: 700; font-size: 1.1rem; border-radius: 0.8rem;
  padding: 0.9rem 1rem; min-height: 3.5rem; cursor: pointer; border: 0;
  -webkit-tap-highlight-color: transparent;
}

button.btn.secondary { background: var(--xp-carmanah); color: var(--xp-white); }
button.btn.secondary:active { background: var(--xp-green); color: var(--xp-dark); }
button.btn.done { background: var(--xp-green); color: var(--xp-dark); }
button.btn.pop { animation: xp-pop 0.32s ease-out; }
@keyframes xp-pop { 0% { transform: scale(0.96); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }
.next-unanswered { width: 100%; margin: 0.7rem 0 0; }
.next-unanswered[hidden] { display: none; }
/* sections and questions slide in and out instead of jumping */
.slide-in { animation: xp-slide-in 0.32s ease-out both; overflow: hidden; }
@keyframes xp-slide-in { from { opacity: 0; max-height: 0; transform: translateY(-8px); } to { opacity: 1; max-height: 80rem; transform: none; } }
.slide-out { animation: xp-slide-out 0.28s ease-in both; overflow: hidden; pointer-events: none; }
@keyframes xp-slide-out { from { opacity: 1; max-height: var(--h, 20rem); } to { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; } }

.sticky-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--xp-dark);

}

.next-step { font-weight: 600; font-size: 0.95rem; margin: 0.8rem 0 0; }

/* confirm dialog */
.overlay { position: fixed; inset: 0; background: rgba(var(--xp-dark-rgb),.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.dialog { background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-carmanah); border-radius: 1rem; padding: 1.2rem; max-width: 26rem; width: 100%; }

footer.app-footer .header-controls { flex-direction: row-reverse; justify-content: space-between; margin-bottom: 0.4rem; }

}


/* version number in the footer opens the change log */
footer.app-footer button.ver-link { font: inherit; color: inherit; background: none; border: 0; padding: 0.25rem 0.15rem; margin: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; border-radius: 0.3rem; -webkit-tap-highlight-color: transparent; }

footer.app-footer button.ver-link:focus-visible { outline: 3px solid var(--xp-solar); outline-offset: 2px; }
.changelog { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(var(--xp-dark-rgb),0.7); }
.changelog-card { width: 100%; max-width: 36rem; max-height: min(85vh, 44rem); display: flex; flex-direction: column; background: var(--xp-white); color: var(--xp-dark); border-radius: 1rem; box-shadow: 0 0 0 3px var(--xp-green), 0 12px 40px rgba(0,0,0,0.4); animation: xp-pop-in 0.3s ease-out; text-align: left; }
.changelog-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.4rem 0.7rem; }

.changelog-body { overflow-y: auto; padding: 0.2rem 1.4rem 1rem; }

.changelog-body section:first-child { border-top: 0; }

/* ---- theme switch (sits in the North Shore header, so it looks the same in both themes) ---- */
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

  display: inline-flex; align-items: center; gap: 0.55rem; min-height: 2.75rem; padding: 0 0.2rem 0 0.6rem;

}

/* ---- seasonal themes: only the header changes (accent rule and a few slow drifting symbols), never the form ---- */
header.app-header { position: relative; overflow: hidden; }
header.app-header .app-header-inner { position: relative; z-index: 1; }
.season-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.season-layer span { position: absolute; top: -2rem; opacity: 0; user-select: none; animation: xp-drift linear infinite; }
/* maple leaves, clovers and the poppy are drawn shapes */

.season-layer .xp-shape.rise { top: auto; bottom: -2rem; animation-name: xp-rise; }
.season-layer .turkey { top: auto; bottom: 0.2rem; left: 0; opacity: 0.8; font-size: 1.5rem; line-height: 1; animation: xp-run linear infinite alternate, xp-hop ease-in-out infinite alternate; }
.season-layer .turkey i { display: block; font-style: normal; animation: xp-turn linear infinite; }
@keyframes xp-run { from { transform: translateX(1vw); } to { transform: translateX(calc(100vw - 3rem)); } }

@keyframes xp-turn { 0%, 49.99% { transform: scaleX(-1); } 50%, 100% { transform: scaleX(1); } }
@keyframes xp-rise { 0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; } 12% { opacity: 0.45; } 88% { opacity: 0.45; } 100% { transform: translate3d(-1rem,-9rem,0) rotate(-30deg); opacity: 0; } }
@keyframes xp-drift { 0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; } 12% { opacity: 0.4; } 88% { opacity: 0.4; } 100% { transform: translate3d(1.5rem,9rem,0) rotate(40deg); opacity: 0; } }
.fw { position: absolute; width: 0; height: 0; }
.fw i { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); opacity: 0; animation: xp-fw 3.4s ease-out infinite; animation-delay: var(--d); }
@keyframes xp-fw { 0% { opacity: 0; transform: rotate(var(--a)) translateX(0) scale(1); } 6% { opacity: 1; } 65% { opacity: 0.85; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) translateY(0.8rem) scale(0.3); } }
/* halloween: a hand-drawn scene (moon, bats, jack-o'-lanterns, cobweb, low fog) instead of emoji */
.hw-moon { position: absolute; right: -2.2rem; top: -2.4rem; width: 8rem; height: 8rem; border-radius: 50%; background: radial-gradient(circle at 38% 38%, #FFE2B0 0%, #F7B25E 55%, #E08A2E 100%); opacity: 0.8; box-shadow: 0 0 40px 12px rgba(242,154,61,0.32); animation: xp-moon 7s ease-in-out infinite alternate; }
@keyframes xp-moon { from { opacity: 0.68; } to { opacity: 0.86; } }
.hw-fog { position: absolute; bottom: -1.2rem; width: 70%; height: 4.5rem; background: radial-gradient(ellipse at center, rgba(190,150,255,0.16), rgba(242,154,61,0.07) 45%, transparent 70%); filter: blur(6px); animation: xp-fog 20s ease-in-out infinite alternate; }
@keyframes xp-fog { from { transform: translateX(-12%); } to { transform: translateX(24%); } }
.hw-bat { position: absolute; left: -4rem; fill: #0a0710; filter: drop-shadow(0 0 4px rgba(242,154,61,0.75)); animation: xp-fly linear infinite; }
.hw-bat .wing { transform-origin: 24px 12px; animation: xp-flap 0.34s ease-in-out infinite alternate; }
@keyframes xp-fly { 0% { transform: translate(0, 0); } 25% { transform: translate(28vw, 10px); } 50% { transform: translate(56vw, -6px); } 75% { transform: translate(84vw, 12px); } 100% { transform: translate(112vw, 0); } }
@keyframes xp-flap { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
.hw-pumpkin { position: absolute; bottom: 0; filter: drop-shadow(0 0 8px rgba(242,154,61,0.55)); }
.hw-pumpkin .face { animation: xp-flick 2.8s ease-in-out infinite; }
@keyframes xp-flick { 0%, 100% { opacity: 1; } 18% { opacity: 0.72; } 34% { opacity: 0.95; } 52% { opacity: 0.6; } 70% { opacity: 1; } 86% { opacity: 0.82; } }
.hw-web { position: absolute; left: 0; top: 0; width: 6rem; height: 6rem; stroke: rgba(255,255,255,0.22); fill: none; stroke-width: 0.8; }
:root[data-season="halloween"] header.app-header { box-shadow: 0 3px 16px -3px rgba(242,154,61,0.55); animation: xp-candle 4.5s ease-in-out infinite; }
@keyframes xp-candle { 0%, 100% { box-shadow: 0 3px 16px -3px rgba(242,154,61,0.55); } 30% { box-shadow: 0 3px 20px -3px rgba(242,154,61,0.8); } 55% { box-shadow: 0 3px 13px -3px rgba(242,154,61,0.4); } 80% { box-shadow: 0 3px 18px -3px rgba(242,154,61,0.7); } }
#poppy-pin { flex: 0 0 auto; margin-left: auto; display: flex; align-items: center; }
@media (prefers-reduced-motion: reduce) { .season-layer:not(.keep) { display: none; } :root[data-season="halloween"] header.app-header { animation: none; } }
.header-controls { display: flex; align-items: center; gap: 0.4rem; flex: 0 0 auto; }
.season-select { font-family: var(--xp-font); font-weight: 600; font-size: 0.8rem; color: var(--xp-white); background: var(--xp-dark); border: 1px solid var(--xp-carmanah); border-radius: 0.5rem; padding: 0.35rem 0.4rem; cursor: pointer; max-width: 9.5rem; }
:root[data-season] header.app-header { border-bottom-color: var(--season); }

/* A time-of-day hello that replaces the header's tagline for a few seconds, with a gentle holiday variant. */
function initGreeting() {
  var p = document.querySelector('header.app-header .header-text p');
  if (!p) return;
  var h = new Date().getHours(), part = h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening');
  var key = document.documentElement.getAttribute('data-season'), sn = SEASONS[key];
  var text = part + (sn && key !== 'remembrance' ? ', and ' + sn.greet : '') + '.', orig = p.textContent;

  setTimeout(function () {
    p.textContent = text; p.style.opacity = '1';
    setTimeout(function () {

/* Two quiet surprises: the logo stretches after ten idle minutes, and a long press on the version line shows the credits. */
function initIdleAndCredits() {
  var logo = document.querySelector('header.app-header img'), idle = null, IDLE_MS = 10 * 60 * 1000;
  function nudge() {
    if (!logo || document.hidden || logo.classList.contains('spin')) { arm(); return; }
    logo.classList.remove('yawn'); void logo.offsetWidth; logo.classList.add('yawn');
    logo.addEventListener('animationend', function done() { logo.classList.remove('yawn'); logo.removeEventListener('animationend', done); });
  }
  function arm() { clearTimeout(idle); idle = setTimeout(nudge, IDLE_MS); }   // after a nudge it stays quiet until the next activity
  ['mousemove', 'keydown', 'pointerdown', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, arm, { passive: true }); });
  arm();

  var ft = document.querySelector('.footer-text'), press = null, shown = null;
  if (!ft) return;
  var orig = ft.innerHTML;
  var longPressed = false;
  function credits() {
    longPressed = true;
    ft.style.opacity = '0';
    setTimeout(function () {
      ft.textContent = 'Made with care by Curtis Gibbons for the Xplore support team.'; ft.style.opacity = '1';
      clearTimeout(shown);
      shown = setTimeout(function () { ft.style.opacity = '0'; setTimeout(function () { ft.innerHTML = orig; ft.style.opacity = '1'; }, 500); }, 4000);
    }, 500);
  }
  function cancel() { clearTimeout(press); }
  ft.addEventListener('pointerdown', function () { cancel(); longPressed = false; press = setTimeout(credits, 900); });
  ft.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.ver-link') && !longPressed) showChangelog(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { ft.addEventListener(ev, cancel); });
  ft.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
